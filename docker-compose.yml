version: "3.9"

services:
  simulator:
    build:
      context: .
      dockerfile: deployments/dockers/simulator.Dockerfile
    ports:
      - "8081:8081"
    environment:
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8081/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

networks:
  default:
    name: stockflow