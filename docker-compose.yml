version: "3.9"

services:
  nats:
    image: nats:2.12-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  simulator:
    build:
      context: .
      dockerfile: deployments/dockers/simulator.Dockerfile
    ports:
      - "8081:8081"
    environment:
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8081/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
  ingestion:
    build:
      context: .
      dockerfile: deployments/dockers/ingestion.Dockerfile
    environment:
      - LOG_LEVEL=debug   
    depends_on:
      simulator:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped
networks:
  default:
    name: stockflow