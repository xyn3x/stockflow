version: "3.9"

services:
  nats:
    image: nats:2.12-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  redis: 
    image: redis:7-alpine 
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped 
  simulator:
    build:
      context: .
      dockerfile: deployments/dockers/simulator.Dockerfile
    ports:
      - "8081:8081"
    environment:
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8081/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
  ingestion:
    build:
      context: .
      dockerfile: deployments/dockers/ingestion.Dockerfile
    environment:
      - LOG_LEVEL=debug   
    depends_on:
      simulator:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped
  processor:
    build:
      context: .
      dockerfile: deployments/dockers/processor.Dockerfile
    environment:
      - LOG_LEVEL=debug
    depends_on:
      simulator:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped
  api: 
    build:
      context: .
      dockerfile: deployments/dockers/api.Dockerfile
    ports:
      - "8080:8080"
    environment:
      - LOG_LEVEL=debug
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v2.51.0
    volumes:
      - ./deployments/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped 
  grafana:
    image: grafana/grafana:10.4.0
    volumes:
      - ./deployments/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    depends_on:
      - prometheus
    restart: unless-stopped 
  redis-exporter:
    image: oliver006/redis_exporter:latest
    environment:
      - REDIS_ADDR=redis://redis:6379
    ports:
      - "9121:9121"
    depends_on:
      - redis
    restart: unless-stopped
  nats-exporter:
    image: natsio/prometheus-nats-exporter:latest
    command: ["-varz", "http://nats:8222"]
    ports:
      - "7777:7777"
    depends_on:
      - nats 
    restart: unless-stopped
networks:
  default:
    name: stockflow