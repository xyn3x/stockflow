global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: simulator
    static_configs:
      - targets:  ["simulator:8081"]
    metrics_path: /metrics

  - job_name: ingestion
    static_configs:
      - targets:  ["ingestion:9091"]
    metrics_path: /metrics

  - job_name: processor
    static_configs:
      - targets:  ["processor:9092"]
    metrics_path: /metrics

  - job_name: api
    static_configs:
      - targets:  ["api:8080"]
    metrics_path: /metrics

  - job_name: nats
    static_configs:
      - targets:  ["nats-exporter:7777"]
    metrics_path: /metrics

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]